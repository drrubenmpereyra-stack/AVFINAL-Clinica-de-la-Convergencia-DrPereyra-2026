function asegurarParticipantesInternos() {
    if (!db.participantes) db.participantes = [];
    listadoOficialEstudiantes.forEach(est => {
        const index = db.participantes.findIndex(p => p.dni === est.dni);
        if (index === -1) {
            db.participantes.push(est);
        } else {
            db.participantes[index].driveFolder = est.driveFolder;
            db.participantes[index].qrFile = est.qrFile;
            db.participantes[index].codigo = est.codigo;
            db.participantes[index].nombre = est.nombre;
            db.participantes[index].profesion = est.profesion;
        }
    });
    localStorage.setItem(DB_KEY, JSON.stringify(db));
}
asegurarParticipantesInternos();

        sesion = { rol: 'USR', nombre: 'RIOS GRACIELA', dni: '17319305' };
    } else if (u === "SCHWAB" && p === "S473") {

    } else if (u === "RODRIGUEZ" && p === "R325") {
        sesion = { rol: 'USR', nombre: 'RODRIGUEZ RAMIRO', dni: '17319325' };
    } else if (u === "CAON" && p === "C703") {
        sesion = { rol: 'USR', nombre: 'CAON FEDERICO', dni: '32458703' };
    } else if (u === "PRAVAZ" && p === "P206") {

    } else if (u === "STEFANINI" && p === "S297") {

            ${db.participantes.map((p, i) => `<tr>

                <td><b>${p.dni}</b></td>

function addP() {
    const ape = document.getElementById('p1').value.toUpperCase();
    const nom = document.getElementById('p2').value;
    const documentId = document.getElementById('p3').value.trim();
    const cod = document.getElementById('p_cod').value.trim();
    const prof = document.getElementById('p4').value;
    const cel = document.getElementById('p5').value;

    if(!documentId) return alert("El campo DNI es obligatorio.");

    if(editIndex === -1) {
        db.participantes.push({ apellido: ape, nombre: nom, dni: documentId, codigo: cod || documentId, profesion: prof, celular: cel });
    } else {
        db.participantes[editIndex] = { apellido: ape, nombre: nom, dni: documentId, codigo: cod || documentId, profesion: prof, celular: cel };
    }
    guardar(); vPart(); renderMenu();
}

function drawNotaTable(dni) {
    if(!dni) return;
    let h = `<table class="table table-bordered bg-white shadow-sm"><thead><tr class="table-dark"><th>Actividad</th><th>Taller</th><th>Examen Final</th></tr></thead><tbody>`;
    db.encuentros.forEach(e => {
        const idT = `${dni}-${e.titulo}-Taller`; const idE = `${dni}-${e.titulo}`;
        let nT = db.notas.find(n => n.id === idT) || { valor: '' }; let nE = db.notas.find(n => n.id === idE) || { valor: '' };
        h += `<tr><td>${e.titulo}</td><td><input type="number" class="form-control" value="${nT.valor}" onchange="sManual('${idT}',this.value)"></td><td><input type="number" class="form-control" value="${nE.valor}" onchange="sManual('${idE}',this.value)"></td></tr>`;
    });
    db.testsIA.forEach(t => {
        const idIA = `${dni}-${t.titulo}`; let nIA = db.notas.find(n => n.id === idIA) || { valor: '' };
        h += `<tr class="table-info"><td>${t.titulo} (Auto IA)</td><td colspan="2"><input type="number" class="form-control" value="${nIA.valor}" onchange="sManual('${idIA}',this.value)"></td></tr>`;

}

function backup() { 
    const ds = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db)); 
    const dl = document.createElement('a'); dl.setAttribute("href", ds); dl.setAttribute("download", "cc_backup.json"); dl.click();

function restaurarBackup() {
    const archivoInput = document.getElementById('import-file');
    if (!archivoInput.files || archivoInput.files.length === 0) return alert("Seleccione un archivo.");
    const lector = new FileReader();
    lector.onload = function(e) {
        try {
            const datosParseados = JSON.parse(e.target.result);
            if (datosParseados.participantes) {
                if (confirm("¿Sobrescribir base de datos?")) { db = datosParseados; asegurarParticipantesInternos(); guardar(); alert("Restaurado."); location.reload(); }
            }
        } catch (err) { alert("Error en JSON."); }
    };
    lector.readAsText(archivoInput.files[0]);
}

        if (sel) total += parseInt(sel.value);

    if (el) el.innerText = total;

window.guardarFila = function(btn) {
    const row = btn.parentNode.parentNode;
    const alumno = row.cells[0].innerText;
    const encuentro = row.cells[1].innerText;
    
    // Obtenemos los valores de los inputs
    const notaTest = row.cells[2].querySelector('input').value;
    const notaTaller = row.cells[3].querySelector('input').value;

    const storedDb = localStorage.getItem('DB_CLINICA');
    const db = storedDb ? JSON.parse(storedDb) : { calificaciones: [] };
    
    // Normalizamos el encuentro para comparar
    const numEncuentro = encuentro.replace(/[^0-9]/g, '');

    // Buscamos si existe un registro (para no duplicar)
    let registro = db.calificaciones.find(c => {
        let nombreC = String(c.alumno || '').trim().toUpperCase().split(' ').sort().join(' ');
        let encuentroC = String(c.encuentro || '').replace(/[^0-9]/g, '');
        return nombreC === alumno && encuentroC === numEncuentro;
    });

    if (registro) {
        // Actualizamos el existente
        registro.notaTest = notaTest;
        registro.notaTaller = notaTaller;
    } else {
        // Si no existe, lo agregamos (aunque con la lógica de consolidación, esto casi no debería ocurrir)
        db.calificaciones.push({ alumno, encuentro, notaTest, notaTaller });
    }

    localStorage.setItem('DB_CLINICA', JSON.stringify(db));
    alert('Datos guardados para: ' + alumno);
    
    // Refrescamos la vista para ver los cambios
    window.vCalificacionesAdmin();
};

window.guardarAsistencia = function() {
    const encuentro = document.getElementById('asist-encuentro').value;
    if (!encuentro) { return alert("Seleccione un encuentro primero"); }

    // 1. Cargamos DB
    let db = JSON.parse(localStorage.getItem('cc_v38_db')) || { asistencias: [] };
    
    // 2. Traemos todos los checkboxes de la tabla
    const checkboxes = document.querySelectorAll('.asist-toggle');
    
    checkboxes.forEach(cb => {
        const dni = cb.getAttribute('data-dni');
        const estaPresente = cb.checked;
        
        // Buscamos si ya existe
        let index = db.asistencias.findIndex(a => a.dni == dni && a.encuentro == encuentro);
        
        if (estaPresente) {
            if (index === -1) {
                // Si no existe, lo creamos
                db.asistencias.push({ dni: dni, encuentro: encuentro, estado: 1 });
            } else {
                // Si existe, nos aseguramos que estado sea 1
                db.asistencias[index].estado = 1;
            }
        } else {
            // Si desmarcamos, eliminamos el registro de la asistencia
            if (index !== -1) {
                db.asistencias.splice(index, 1);
            }
        }
    });

    // 3. Guardamos
    localStorage.setItem('cc_v38_db', JSON.stringify(db));
    alert("✅ Asistencia del encuentro guardada correctamente.");
    console.log("DB Actualizada:", db.asistencias);
};

window.exportarAAdministracion = function() {

        return alert("No hay datos de talleres guardados para exportar.");
    }

    // 2. Cargamos la DB principal directamente del localStorage para asegurar integridad
    let fullDb = JSON.parse(localStorage.getItem('DB_CLINICA')) || { respuestasIA: {}, calificaciones: [] };
    
    // Seguridad: inicializar si es necesario
    if (!fullDb.calificaciones || !Array.isArray(fullDb.calificaciones)) fullDb.calificaciones = [];

    let exportados = 0;
    let actualizados = 0;

    // 3. Procesamos los datos
    db.calificacionesTaller.forEach(taller => {
        // Buscamos coincidencia en la tabla calificaciones de la DB principal
        let calEntry = fullDb.calificaciones.find(c => 
            c.alumno === taller.alumno && c.encuentro === taller.encuentro
        );

        if (calEntry) {
            // Caso: Existe -> Actualizamos la nota
            calEntry.notaTaller = taller.notaTaller;
            actualizados++;
        } else {
            // Caso: No existe -> Creamos nuevo registro
            fullDb.calificaciones.push({
                alumno: taller.alumno,
                encuentro: taller.encuentro,
                notaTest: 0, 
                notaTaller: taller.notaTaller,
                feedbackTaller: ""
            });
            exportados++;
        }
    });

    // 4. Guardamos en localStorage y actualizamos la referencia global
    localStorage.setItem('DB_CLINICA', JSON.stringify(fullDb));
    db = fullDb; // Sincronizamos la variable global por si se usa en otros lados

        const califFila = db.calificacionesTaller.find(c => String(c.dni).trim() === dniLimpio && Number(c.encuentro) === nroEncuentro);

        const elTest = fila.querySelector('.nota-test');

        // Asignamos valores (priorizando las fuentes encontradas)

        if (elTaller) elTaller.value = califFila ? (califFila.nota || 0) : 0; // O califFila.taller según tu estructura
        if (elAsist) elAsist.value = asistFila ? (asistFila.asistencia || 0) : 0;
    });

window.calcularAnalitico = function() {
    const inputsTest = document.querySelectorAll('.nota-test');
    const inputsTaller = document.querySelectorAll('.nota-taller');
    const inputsAsist = document.querySelectorAll('.asist-enc');
    
    let totalNota = 0;
    let totalAsist = 0;
    let count = 0;

    inputsTest.forEach((el, i) => {
        let t = parseFloat(el.value) || 0;
        let tal = parseFloat(inputsTaller[i].value) || 0;
        let as = parseFloat(inputsAsist[i].value) || 0;
        
        console.log(`Fila ${i}: Test=${t}, Taller=${tal}, Asist=${as}`); // Debug
        
        totalNota += (t + tal) / 2;
        totalAsist += as;
        count++;
    });

    const prom = count > 0 ? (totalNota / count).toFixed(2) : 0;
    console.log("Promedio calculado:", prom, "Total asistencias:", totalAsist);

    // Actualizar vista
    const elProm = document.getElementById('res-prom');
    const elCond = document.getElementById('res-cond');
    
    if (elProm) elProm.innerText = prom;
    
    // Lógica de Condición
    let estado = "En proceso";
    if (totalAsist >= 6 && prom >= 7) estado = "Promocionado";
    else if (totalAsist < 6 && prom >= 7) estado = "Regular";
    else if (totalAsist < 4 && prom >= 6) estado = "Libre";
    else if (totalAsist < 4 && prom < 4) estado = "No logró acreditación";
    
    if (elCond) elCond.innerText = estado;
}

        // Buscamos si ya existe el registro en la BD
        let idx = db.asistencias.findIndex(a => a.dni === dni && a.encuentro === encuentro);

        if (estaMarcado) {
            // Si está marcado y no existe, agregamos; si existe, aseguramos estado 1
            if (idx === -1) {
                db.asistencias.push({ dni: dni, encuentro: encuentro, estado: 1 });
            } else {
                db.asistencias[idx].estado = 1;
            }
        } else {
            // Si no está marcado, si existía el registro, lo eliminamos o ponemos estado 0
            if (idx !== -1) {
                db.asistencias.splice(idx, 1);
            }
        }
    });

    // Guardamos en localStorage
    localStorage.setItem('cc_v38_db', JSON.stringify(db));
    alert("✅ Asistencia guardada correctamente en la Base de Datos.");
};

(function() {
    function crearPanel(titulo, datos) {
        if (document.getElementById('panel-notas')) document.getElementById('panel-notas').remove();
        const panel = document.createElement('div');
        panel.id = 'panel-notas';
        panel.style = "position:fixed; top:20px; right:20px; z-index:999999; background:#fff; border:2px solid #333; padding:15px; border-radius:8px; box-shadow:0 4px 8px rgba(0,0,0,0.3); width:300px; max-height:80vh; overflow-y:auto;";
        
        panel.innerHTML = `
            <h4 style="margin:0 0 10px 0; font-family:sans-serif; font-size:14px; color:#333;">${titulo}:</h4>
            <div style="background:#f4f4f4; padding:10px; border-radius:4px; font-family:monospace; font-size:12px; margin-bottom:10px;">
                ${datos.length > 0 ? datos.join('<br>') : "No hay alumnos marcados"}
            </div>
            <button id="btn-cerrar-panel" style="width:100%; padding:8px; background:#d9534f; color:white; border:none; border-radius:4px; cursor:pointer; font-weight:bold;">CERRAR</button>
        `;
        document.body.appendChild(panel);
        document.getElementById('btn-cerrar-panel').onclick = () => panel.remove();
    }

    document.addEventListener('keydown', function(event) {
        
        // --- F8: ASISTENCIA (Lógica de Mapeo) ---
        if (event.key === 'F8') {
            // Buscamos todas las filas de la tabla
            const filas = document.querySelectorAll('tr'); 
            const listaPresentes = [];

            filas.forEach(fila => {
                const checkbox = fila.querySelector('input[type="checkbox"]');
                // Si hay checkbox y está marcado
                if (checkbox && checkbox.checked) {
                    // Buscamos el texto en las otras celdas de esa fila (el nombre)
                    const nombre = fila.innerText.replace(/[\n\r]/g, ' ').trim().split('\t')[0];
                    listaPresentes.push(`${nombre} Presente`);
                }
            });

            crearPanel("Asistencia", listaPresentes);
        }

        // --- F9: CALIFICACIONES ---
        else if (event.key === 'F9') {
            const inputs = document.querySelectorAll('input.form-control:not([id])');
            const notasRotuladas = [];
            
            for (let i = 0; i < inputs.length; i++) {
                const valor = inputs[i].value.trim();
                if (valor === "") continue;
                const tipo = (i % 2 === 0) ? "Test" : "Taller";
                const numero = Math.floor(i / 2) + 1;
                notasRotuladas.push(`${tipo}_${numero}: ${valor}`);
            }
            crearPanel("Calificaciones", notasRotuladas);
        }
    });
})();
// Función para generar el espejo fiel del formulario
async function generarPDFAnalitico() {
    const { jsPDF } = window.jspdf;
    const elemento = document.getElementById('main-view'); // Capturamos el contenedor principal
    
    // Usamos html2canvas para la captura fiel (asegura el estilo, logos y colores)
    const canvas = await html2canvas(elemento, { scale: 2, backgroundColor: "#ffffff" });
    const imgData = canvas.toDataURL('image/png');
    
    const pdf = new jsPDF('p', 'mm', 'a4');
    const anchoPagina = pdf.internal.pageSize.getWidth();
    const altoImagen = (canvas.height * anchoPagina) / canvas.width;
    
    pdf.addImage(imgData, 'PNG', 0, 0, anchoPagina, altoImagen);
    
    // Convertir a Blob para el visor
    const pdfBlob = pdf.output('blob');
    mostrarVisorPDF(pdfBlob);
}

function mostrarVisorPDF(blob) {
    const url = URL.createObjectURL(blob);
    const overlay = document.createElement('div');

window.cargarBackup = function(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = JSON.parse(e.target.result);
            db = data; // Sobrescribe la base de datos
            localStorage.setItem('backup_automatico_completo', JSON.stringify(db)); // Guarda en navegador
            alert("✅ Backup cargado correctamente.");
            location.reload(); // Recarga para aplicar los datos
        } catch (err) {
            alert("❌ Error: El archivo no es válido.");
        }
    };
    reader.readAsText(file);
};

window.abrirPanelEstrellas = function() {
    const colores = ["#FF0000", "#008000", "#0000FF", "#FFD700", "#FF8C00", "#FF00FF", "#8A2BE2", "#50C878", "#00FFFF", "#CC7722"];
    
    const overlay = document.createElement('div');
    overlay.id = "panel-estrellas";
    overlay.style = "position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; display:flex; justify-content:center; align-items:center; flex-direction:column;";
    
    let html = `<h2 style="color:white; margin-bottom:20px;">Selecciona el Eje de Aprendizaje</h2>
                <div style="display:grid; grid-template-columns: repeat(5, 1fr); gap:20px;">`;

    for (let i = 0; i < 10; i++) {
        html += `<div onclick="lanzarCuestionario(${i + 1}, this)" style="
            width: 80px; height: 80px;
            background: ${colores[i]};
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            border: 3px solid black;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            font-weight: bold; font-size: 1.2em; color: white; text-shadow: 1px 1px 2px black;
            transition: transform 0.2s;">
            ${i + 1}
        </div>`;
    }
    
    html += `</div><button onclick="document.getElementById('panel-estrellas').remove()" style="margin-top:30px; padding:10px 20px; cursor:pointer;">Cerrar</button>`;
    
    overlay.innerHTML = html;
    document.body.appendChild(overlay);
};
window.lanzarCuestionario = function(num, el) {
    const links = {
        1: "https://gemini.google.com/share/cae4fdd19682",
        2: "https://gemini.google.com/share/5a1c216856ac",
        3: "https://gemini.google.com/share/b76f77c2fcc1",
        4: "https://gemini.google.com/share/c64827a67672"
    };

    // 1. Registro inicial (AQUÍ ESTÁ EL CAMBIO)
    registrarActividadAuto(num, "INICIO_CUESTIONARIO");

    // 2. Efecto visual
    el.style.boxShadow = "0 0 25px 10px #00FF00";
    el.style.transform = "scale(1.1)";
    
    setTimeout(() => {
        if(links[num]) {
            window.open(links[num], '_blank');
            // 3. Solicitamos la reflexión tras 5 segundos
            setTimeout(() => solicitarReflexion(num), 5000); 
        }
        el.style.boxShadow = "none";
        el.style.transform = "scale(1)";
    }, 300);
};
